[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanboard-mcp-server"
version = "0.2.0"
description = "MCP server that lets Claude create and track tasks on a self-hosted Kanboard"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "b-ak" }]
keywords = ["mcp", "kanboard", "claude", "task-management", "kanban"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/b-ak/kanboard-mcp-server"

[project.scripts]
kanboard-mcp = "kanboard_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/kanboard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
